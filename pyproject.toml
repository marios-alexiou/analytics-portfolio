[project]
name = "fieldcraft-analytics"
version = "0.1.0"
description = "End-to-end analytics engineering portfolio project for a fictional B2B SaaS company."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
