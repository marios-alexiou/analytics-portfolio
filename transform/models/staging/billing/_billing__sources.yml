version: 2

sources:
  - name: billing
    description: Exports from the payment provider (Stripe-like). Amounts are integers in minor units.
    schema: raw_billing
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
    tables:
      - name: subscriptions
        description: Current state of every subscription at extract time. Overwritten on each load.
      - name: subscription_events
        description: >
          Webhook log of subscription lifecycle events. Delivery is at-least-once, so the same event_id
          can appear more than once, and some events arrive days after they occurred.
        columns:
          - name: event_id
            description: Event ID; not unique here because of repeated deliveries.
            data_tests:
              # Deduplication must never lose an event.
              - relationships:
                  arguments:
                    to: ref('stg_billing__subscription_events')
                    field: event_id
      - name: invoices
        description: Every invoice issued, including prorations for mid-period upgrades.
