name: fieldcraft
version: "1.0.0"
profile: fieldcraft
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  internal_email_domain: fieldcraft.io
  # Reporting window; as_of_date is the day the raw data was extracted.
  start_date: "2024-01-01"
  as_of_date: "2026-09-30"

models:
  fieldcraft:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  fieldcraft:
    +schema: seeds
