name: fieldcraft
version: "1.0.0"
profile: fieldcraft
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  internal_email_domain: fieldcraft.io

models:
  fieldcraft:
    staging:
      +materialized: view
      +schema: staging

seeds:
  fieldcraft:
    +schema: seeds
