version: 2

seeds:
  - name: country_codes
    description: ISO country codes with display names and the sales region each country belongs to.
    columns:
      - name: country_code
        description: ISO 3166-1 alpha-2 country code.
        data_tests: [unique, not_null]
      - name: country_name
        description: English country name, also used to match signups that typed the name instead of the code.
        data_tests: [unique, not_null]
      - name: region
        description: Sales region used for reporting.
        data_tests: [not_null]

  - name: plans
    description: Fieldcraft's subscription plans and their order, used to classify plan changes as upgrades or downgrades.
    columns:
      - name: plan_id
        description: Plan identifier as used by the billing system.
        data_tests: [unique, not_null]
      - name: plan_name
        description: Plan name shown to customers.
      - name: plan_tier
        description: Plan rank; a higher tier is a more expensive plan.
        data_tests: [unique, not_null]

  - name: acquisition_channels
    description: >
      The marketing channels a signup can be attributed to, how the web analytics tool groups each one, and
      which ad platform it spends through.
    columns:
      - name: acquisition_channel
        description: Channel as derived from signup UTMs.
        data_tests: [unique, not_null]
      - name: channel_group
        description: Default channel group the web analytics tool reports sessions under. Meta and LinkedIn share Paid Social.
        data_tests: [not_null]
      - name: is_paid
        description: True when acquiring through the channel costs money (ads or affiliate commission).
      - name: ad_platform
        description: Ad platform that carries the channel's spend; empty for channels without ad spend.
